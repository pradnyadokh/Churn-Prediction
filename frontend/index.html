<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <link rel="stylesheet" href="static/styles.css">
    <title>Churn | Customer Churn Prediction</title>
</head>
<body>
    <div class="container">
        <div class="py-5 text-center">
            <img class="d-block mx-auto mb-4" src="static/img/churn.jpg" alt="Churn illustration" style="width: 150px; height: auto;">
            <h2>Customer Churn Prediction</h2>
            <p class="lead">Fill the values below to predict customer churn</p>
        </div>

        <div class="row">
            <div class="col-md-12">
                <h4 class="mb-3">Customer Details</h4>
                <form id="churn-form" class="needs-validation">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="tenure">Tenure</label>
                            <input type="number" class="form-control" id="tenure" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="citytier">City Tier</label>
                            <input type="number" class="form-control" id="citytier" min="1" max="3" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="warehousetohome">Warehouse To Home</label>
                            <input type="number" class="form-control" id="warehousetohome" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="gender">Gender</label>
                            <select id="gender" class="form-control" required>
                                <option value="" selected disabled>Select gender</option>
                                <option value="female">Female</option>
                                <option value="male">Male</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="hourspendonapp">Hour Spend On App</label>
                            <input type="number" class="form-control" id="hourspendonapp" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="numberofdeviceregistered">Number Of Device Registered</label>
                            <input type="number" class="form-control" id="numberofdeviceregistered" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="satisfactionscore">Satisfaction Score</label>
                            <input type="number" class="form-control" id="satisfactionscore" min="1" max="5" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="maritalstatus">Marital Status</label>
                            <select id="maritalstatus" class="form-control" required>
                                <option value="" selected disabled>Select status</option>
                                <option value="divorced">Divorced</option>
                                <option value="married">Married</option>
                                <option value="single">Single</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="numberofaddress">Number Of Address</label>
                            <input type="number" class="form-control" id="numberofaddress" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="complain">Complain (0 or 1)</label>
                            <input type="number" class="form-control" id="complain" min="0" max="1" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="orderamounthikefromlastyear">Order Amount Hike From Last Year</label>
                            <input type="number" class="form-control" id="orderamounthikefromlastyear" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="couponused">Coupon Used</label>
                            <input type="number" class="form-control" id="couponused" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="ordercount">Order Count</label>
                            <input type="number" class="form-control" id="ordercount" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="daysincelastorder">Day(s) Since Last Order</label>
                            <input type="number" class="form-control" id="daysincelastorder" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="cashbackamount">Cashback Amount</label>
                            <input type="number" class="form-control" id="cashbackamount" step="0.01" required>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg btn-block" type="submit">Predict</button>
                </form>

                <p id="loading-message" class="loading hidden">Running prediction...</p>
                <p id="error-message" class="error-message hidden"></p>

                <div id="result-section" class="prediction-container hidden">
                    <h3>Prediction Result</h3>
                    <p>Model predicted that customer is likely to:</p>
                    <h2 id="prediction-label"></h2>
                    <p>Probability of customer churning: <strong id="probability-value"></strong></p>
                    <button id="predict-again" class="btn btn-secondary">Predict Another Customer</button>
                </div>
            </div>
        </div>

        <footer class="my-5 pt-5 text-muted text-center text-small">
            <p class="mb-1">Customer Churn Prediction Application</p>
        </footer>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
